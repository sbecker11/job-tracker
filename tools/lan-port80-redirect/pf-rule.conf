# Redirects incoming TCP port 80 on the LAN interface to the Pending
# Actions Vite dev server, which stays bound to 127.0.0.1:3174 exactly as
# tools/pending-actions-ui-server/run.sh already starts it — this rule
# does the port/host translation at the packet-filter layer instead of
# rebinding Vite itself to 0.0.0.0, so the dev server's own exposure
# doesn't change.
#
# Loaded into the "com.apple/*" rdr-anchor point that macOS's stock
# /etc/pf.conf already declares (see `rdr-anchor "com.apple/*"` there) —
# install.sh loads this file under that anchor via `pfctl -a`, so no edits
# to /etc/pf.conf or /etc/pf.anchors are needed.
#
# Interface: en0 is this Mac's LAN adapter (`ipconfig getifaddr en0`).
# Update it here if that ever changes (e.g. switching to Wi-Fi/en1).
rdr pass on en0 inet proto tcp from any to any port 80 -> 127.0.0.1 port 3174
